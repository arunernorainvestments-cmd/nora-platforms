name: nora_arena
description: N.O.R.A. Arena — mobile Arena/Battle app (shares the nora-platforms backend).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State — same as web app. NO codegen, NO @riverpod, NO build_runner (CLAUDE.md).
  flutter_riverpod: ^2.5.1

  # Backend (same project + anon key as web)
  supabase_flutter: ^2.5.0

  # Routing
  go_router: ^14.2.0

  # Game engine + animation (see ARCHITECTURE.md)
  flame: ^1.18.0
  flame_riverpod: ^5.4.0      # Flame <-> Riverpod bridge
  flame_rive: ^1.11.0         # Rive rigs inside the Flame world
  rive: ^0.13.0               # character state-machine rigs
  lottie: ^3.1.0              # one-shot ability / chit FX overlays

  # Licensing import + verification
  http: ^1.2.0                # N.O.R.A. REST API calls
  crypto: ^3.0.3              # ECDSA P-256 signature check on verify responses
  cached_network_image: ^3.3.1 # licensed-likeness portraits

  # Platform integration (wired in later phases)
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  purchases_flutter: ^7.0.0   # RevenueCat IAP (token packs, chits)

  # Misc
  url_launcher: ^6.3.0        # "Browse more on N.O.R.A. Platforms"
  qr_flutter: ^4.1.0
  flutter_dotenv: ^5.1.0      # env-loaded keys (same pattern as web app)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/battle/rive/
    - assets/battle/lottie/
    - assets/battle/sprites/
    - assets/ui/
