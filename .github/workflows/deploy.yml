name: Build and Deploy to Vercel

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > flutter_app/.env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> flutter_app/.env

      - name: Get dependencies
        run: cd flutter_app && flutter pub get

      - name: Build web
        run: cd flutter_app && flutter build web --release --no-tree-shake-icons

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build landing page
        run: cd landing && npm ci && npm run build

      - name: Prepare Vercel output structure
        run: |
          mkdir -p .vercel/output/static
          cp -r flutter_app/build/web/. .vercel/output/static/
          cp -r landing/dist/. .vercel/output/static/home/
          cat > .vercel/output/config.json << 'JSON'
          {
            "version": 3,
            "routes": [
              {
                "handle": "filesystem"
              },
              {
                "src": "/privacy",
                "dest": "/privacy.html"
              },
              {
                "src": "/terms",
                "dest": "/terms.html"
              },
              {
                "src": "/tiktok-verification",
                "dest": "/tiktok-verification.html"
              },
              {
                "src": "/home",
                "dest": "/home/index.html"
              },
              {
                "src": "/home/(.*)",
                "dest": "/home/index.html"
              },
              {
                "src": "/((?!home|privacy|terms|tiktok-verification).*)",
                "dest": "/index.html"
              }
            ]
          }
          JSON

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes --prebuilt
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
