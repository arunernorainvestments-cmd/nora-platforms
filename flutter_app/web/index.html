<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mint your viral moments into playable BattleChit cards, battle in the shared arena, and back your favorite creators in live markets. One wallet, one world — N.O.R.A. Platforms.">
  <meta name="theme-color" content="#0A0A0F">

  <!-- Open Graph (link previews on socials/messengers) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="N.O.R.A. Platforms">
  <meta property="og:title" content="N.O.R.A. Platforms — Moments: mint it. battle it.">
  <meta property="og:description" content="Turn your viral moments into playable BattleChit cards. Battle in the shared arena and back your favorite creators in live markets.">
  <meta property="og:url" content="https://noraplatforms.com/">
  <meta property="og:image" content="https://noraplatforms.com/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="N.O.R.A. Platforms — Moments: mint it. battle it.">
  <meta name="twitter:description" content="Turn your viral moments into playable BattleChit cards. Battle in the shared arena and back your favorite creators in live markets.">
  <meta name="twitter:image" content="https://noraplatforms.com/og-image.jpg">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="N.O.R.A. Platforms">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>N.O.R.A. Platforms — Moments Card Battler</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { margin: 0; background: #0A0A0F; }
    #html-footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: sans-serif;
      font-size: 12px;
      z-index: 0;
    }
    #html-footer a {
      color: #8B8FA8;
      text-decoration: underline;
      margin: 0 8px;
    }
    /* Branded loading splash — shown while main.dart.js downloads/boots; removed
       on Flutter's first frame (see script at the bottom of <body>). */
    #nora-splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #0A0A0F;
      transition: opacity 0.35s ease;
    }
    #nora-splash.nora-splash-out { opacity: 0; pointer-events: none; }
    #nora-splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 0 42px rgba(108, 99, 255, 0.45);
    }
    #nora-splash .nora-splash-name {
      font-family: sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #EDEBFF;
    }
    #nora-splash .nora-splash-spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(108, 99, 255, 0.25);
      border-top-color: #6C63FF;
      border-radius: 50%;
      animation: nora-spin 0.9s linear infinite;
    }
    @keyframes nora-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="nora-splash" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
    <div class="nora-splash-name">N.O.R.A. PLATFORMS</div>
    <div class="nora-splash-spinner"></div>
  </div>

  <!-- These links are required for Google and Meta policy verification.
       They remain in the HTML DOM regardless of how Flutter renders. -->
  <footer id="html-footer">
    <a href="/privacy">Privacy Policy</a>
    <span style="color:#8B8FA8;">·</span>
    <a href="/terms">Terms of Service</a>
  </footer>

  <!-- BattleChit clip trimmer (ffmpeg.wasm is lazy-loaded by this shim on first use) -->
  <script src="js/nora_trim.js" defer></script>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('nora-splash');
      if (!splash) return;
      splash.classList.add('nora-splash-out');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
</body>
</html>
